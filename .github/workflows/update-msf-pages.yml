name: Update MSF Character HTML

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "data/sources.json"
      - "scripts/fetch-and-build.js"
      - ".github/workflows/update-msf-pages.yml"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run source query and HTML builder
        run: npm run build

      - name: Commit generated HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/characters/
          git diff --staged --quiet || git commit -m "chore: update MSF character HTML snapshots"
          git push
